name: Test

permissions:
  contents: read

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm check

  tests:
    needs: [lint]
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26
        os:
          - ubuntu-24.04
          - macos-26
        include:
          # node-caged publishes Linux images; latest tracks its newest Node build.
          - node: latest, caged
            os: ubuntu-24.04
            container: platformatic/node-caged:latest
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        if: ${{ !matrix.container }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - name: Verify caged runtime
        if: ${{ matrix.container }}
        run: >-
          pnpm exec node -e '
          console.log(process.version, process.execPath);
          if (process.config.variables.v8_enable_pointer_compression !== 1)
          throw new Error("Expected node-caged with V8 pointer compression");'
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: |
          pnpm run build
          pnpm run test:unit --reporter=agent --reporter=github-actions
          pnpm run test:integration --reporter=agent --reporter=github-actions
          pnpm run test:e2e --reporter=agent --reporter=github-actions
          pnpm --filter @nmtjs/neem run test:stress --reporter=agent --reporter=github-actions

  # prom-client's engines still include Node 22, which the main test matrix doesn't cover.
  tests-prom-client-node22:
    needs: [lint]
    name: Tests (prom-client, Node 22)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm --filter @nmtjs/prom-client run test:unit --reporter=github-actions
          pnpm --filter @nmtjs/prom-client run test:integration --reporter=github-actions

  tests-bun:
    needs: [lint]
    name: Tests (Bun ${{ matrix.bun }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        bun:
          - 1.4.x
        os:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Bun ${{ matrix.bun }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: bun run --bun build
      - run: bun run --bun test:unit --reporter=agent --reporter=github-actions
      - run: bun run --bun test:integration --reporter=agent --reporter=github-actions
      - run: bun run --bun test:e2e --reporter=agent --reporter=github-actions

  tests-integration-services:
    needs: [lint]
    name: Service integration (${{ matrix.name }})
    # Workflow integration files share these servers, so they run one at a
    # time; shards split them across jobs that each get their own servers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workflows 1/3
            shard: 1/3
          - name: workflows 2/3
            shard: 2/3
          - name: workflows 3/3
            shard: 3/3
          - name: pubsub, workflows e2e
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --restart always
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6380:6379
        options: >-
          --restart always
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: neemata
          POSTGRES_PASSWORD: neemata
          POSTGRES_DB: neemata
        options: >-
          --health-cmd "pg_isready -U neemata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - name: Run workflow integration tests
        if: ${{ matrix.shard }}
        run: >-
          pnpm --filter @nmtjs/workflows run test:integration
          --shard=${{ matrix.shard }} --reporter=agent --reporter=github-actions
        env:
          NMTJS_REQUIRE_SERVICE_TESTS: '1'
          REDIS_URL: redis://localhost:6379
          VALKEY_URL: redis://localhost:6380
          POSTGRES_URL: postgres://neemata:neemata@localhost:5432/neemata
      - name: Run pubsub integration tests
        if: ${{ !matrix.shard }}
        run: >-
          pnpm --filter @nmtjs/pubsub run test:integration
          --reporter=agent --reporter=github-actions
        env:
          NMTJS_REQUIRE_SERVICE_TESTS: '1'
          REDIS_URL: redis://localhost:6379
          VALKEY_URL: redis://localhost:6380
      - name: Run workflow e2e tests against PostgreSQL
        if: ${{ !matrix.shard }}
        # The Tests jobs run these without a server, skipping the PostgreSQL case.
        run: >-
          pnpm --filter @nmtjs/workflows run test:e2e
          --reporter=agent --reporter=github-actions
        env:
          NMTJS_REQUIRE_SERVICE_TESTS: '1'
          POSTGRES_URL: postgres://neemata:neemata@localhost:5432/neemata
