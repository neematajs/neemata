name: Test

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: packages/proxy
          components: rustfmt, clippy
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm check
      - run: pnpm run test:benchmark-tools
      - run: pnpm run test:release

  tests:
    needs: [lint]
    name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26
        os:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: packages/proxy
          components: rustfmt, clippy
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: |
          pnpm run test --reporter=agent --reporter=github-actions
          pnpm --filter @nmtjs/neem run test:e2e --reporter=agent --reporter=github-actions

  tests-bun:
    needs: [lint]
    name: Tests (Bun ${{ matrix.bun }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        bun:
          - 1.4.0
        os:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Bun ${{ matrix.bun }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: packages/proxy
          components: rustfmt, clippy
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: bun run --bun test --reporter=agent --reporter=github-actions
      - run: bun run --bun test:e2e --reporter=agent --reporter=github-actions
        working-directory: packages/neem

  tests-integration-services:
    needs: [lint]
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --restart always
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6380:6379
        options: >-
          --restart always
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: neemata
          POSTGRES_PASSWORD: neemata
          POSTGRES_DB: neemata
        options: >-
          --health-cmd "pg_isready -U neemata"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: packages/proxy
          components: rustfmt, clippy
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - run: pnpm install
      - run: pnpm build
      - name: Run service integration tests
        # Workflow resilience tests restart shared services and change memory limits.
        run: >-
          pnpm --workspace-concurrency=1 --filter @nmtjs/pubsub --filter @nmtjs/workflows
          run test:integration --reporter=agent --reporter=github-actions
        env:
          NMTJS_REQUIRE_SERVICE_TESTS: '1'
          NMTJS_ALLOW_REDIS_SERVICE_RESTARTS: '1'
          NMTJS_ALLOW_REDIS_MEMORY_PRESSURE_TESTS: '1'
          REDIS_URL: redis://localhost:6379
          VALKEY_URL: redis://localhost:6380
          POSTGRES_URL: postgres://neemata:neemata@localhost:5432/neemata
      - name: Run workflow adapter contracts and retries against Redis and Valkey
        run: >-
          pnpm --filter @nmtjs/workflows exec vitest run
          --config vitest.config.ts tests/runtime-adapter-contract.spec.ts
          tests/runtime-manual-retry.spec.ts
          --reporter=agent --reporter=github-actions
        env:
          REDIS_URL: redis://localhost:6379
          VALKEY_URL: redis://localhost:6380
