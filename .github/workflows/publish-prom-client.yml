name: Publish prom-client

permissions:
  contents: write
  id-token: write

# Serialize releases across all publishing workflows and branches.
concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
      run_tests:
        description: Run package tests before publishing
        type: boolean
        default: true
      release:
        description: Create a GitHub release
        type: boolean
        default: true
      pre_release:
        description: Mark the GitHub release as a prerelease
        type: boolean
        default: false
      autotag:
        description: Create a Git tag
        type: boolean
        default: true

jobs:
  test:
    if: inputs.run_tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir packages/prom-client run check:type && pnpm --dir packages/prom-client run test

  publish:
    needs: [test]
    if: always() && !cancelled() && (!inputs.run_tests || needs.test.result == 'success')
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      VERSION_TAG: prom-client-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set package version
        run: pnpm --dir packages/prom-client pkg set version="$RELEASE_VERSION"
      - name: Publish package
        run: |
          TAG=$(node scripts/tag.js "$RELEASE_VERSION")
          pnpm publish --dry-run --filter "@nmtjs/prom-client" --access public --no-git-checks --tag="$TAG"
          pnpm publish --filter "@nmtjs/prom-client" --access public --no-git-checks --tag="$TAG"
      - name: Create Git tag
        if: inputs.autotag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${process.env.VERSION_TAG}`,
              sha: context.sha,
            })
      - name: Create GitHub release
        if: inputs.release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.VERSION_TAG,
              target_commitish: context.sha,
              name: process.env.VERSION_TAG,
              draft: false,
              prerelease: ${{ inputs.pre_release }},
              generate_release_notes: true,
            })
