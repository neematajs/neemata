name: Publish proxy

permissions:
  contents: write
  id-token: write

# Serialize releases across all publishing workflows and branches.
concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        type: string
        required: true
      run_tests:
        description: Run package tests before publishing
        type: boolean
        default: true
      release:
        description: Create a GitHub release
        type: boolean
        default: true
      pre_release:
        description: Mark the GitHub release as a prerelease
        type: boolean
        default: false
      autotag:
        description: Create a Git tag
        type: boolean
        default: true

jobs:
  test:
    if: inputs.run_tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: packages/proxy
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - name: Check and test proxy
        run: pnpm --dir packages/proxy run check:rust && pnpm --dir packages/proxy run test

  build:
    uses: ./.github/workflows/proxy-build.yml
    with:
      version: ${{ inputs.version }}

  publish:
    needs: [test, build]
    if: >-
      always() && !cancelled() &&
      (!inputs.run_tests || needs.test.result == 'success') &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      VERSION_TAG: proxy-v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download proxy binaries
        uses: actions/download-artifact@v4
        with:
          pattern: proxy-*
          path: packages/proxy/artifacts
      - name: Download proxy loader
        uses: actions/download-artifact@v4
        with:
          name: proxy-loader
          path: packages/proxy/dist
      - name: Set package version
        run: pnpm --dir packages/proxy pkg set version="$RELEASE_VERSION"
      - name: Assemble proxy platform packages
        working-directory: packages/proxy
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts
          test -s dist/index.js
          test -s dist/index.d.ts
          # N-API skips missing binaries; fail before publishing an incomplete release.
          for directory in npm/*; do
            for binary in "$directory"/*.node; do test -s "$binary"; done
            cp LICENSE.md "$directory/"
          done
      - name: Publish proxy platform packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          TAG=$(node scripts/tag.js "$RELEASE_VERSION")
          NPM_CONFIG_TAG="$TAG" pnpm --dir packages/proxy exec napi pre-publish --no-gh-release -t npm
      - name: Publish package
        run: |
          TAG=$(node scripts/tag.js "$RELEASE_VERSION")
          pnpm publish --dry-run --filter "@nmtjs/proxy" --access public --no-git-checks --tag="$TAG"
          pnpm publish --filter "@nmtjs/proxy" --access public --no-git-checks --tag="$TAG"
      - name: Create Git tag
        if: inputs.autotag
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.createRef({
              ...context.repo,
              ref: `refs/tags/${process.env.VERSION_TAG}`,
              sha: context.sha,
            })
      - name: Create GitHub release
        if: inputs.release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: process.env.VERSION_TAG,
              target_commitish: context.sha,
              name: process.env.VERSION_TAG,
              draft: false,
              prerelease: ${{ inputs.pre_release }},
              generate_release_notes: true,
            })
