name: Publish Neem stack

permissions:
  contents: read

# Serialize releases across all publishing workflows and branches.
concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Whether to run tests before publishing'
        type: boolean
        required: true
        default: false
      release:
        description: 'Whether to publish release'
        type: boolean
        required: true
        default: true
      pre_release:
        description: 'Whether it is a pre-release'
        type: boolean
        required: true
        default: false
      autotag:
        description: 'Whether to create a tag'
        type: boolean
        required: true
        default: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check committed stack version
        id: read
        run: |
          version=$(node scripts/release.js stack)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: [version]
    if: ${{ inputs.run_tests }}
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-and-publish:
    needs: [version, test]
    permissions:
      # Only the publish job mints npm OIDC tokens and creates tags/releases.
      contents: write
      id-token: write
    if: >-
      always() && !cancelled() && needs.version.result == 'success' &&
      (!inputs.run_tests || needs.test.result == 'success')
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: v${{ needs.version.outputs.version }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add shared README and license
        run: |
          # Packages with their own README keep it; the rest get the root one.
          pnpm --filter "./packages/*" --filter "!@nmtjs/proxy" --filter "!@nmtjs/prom-client" -r exec sh -c 'test -f README.md || cp "$GITHUB_WORKSPACE/README.md" ./'
          pnpm --filter "./packages/*" --filter "!@nmtjs/proxy" --filter "!@nmtjs/prom-client" -r exec cp "$GITHUB_WORKSPACE/LICENSE.md" ./

      - name: Build TypeScript packages
        run: pnpm run build:ts

      - name: Dry-run publish and publish
        run: |
          TAG=$(node scripts/tag.js "$RELEASE_VERSION")
          pnpm publish --dry-run --filter "./packages/*" --filter "!@nmtjs/proxy" --filter "!@nmtjs/prom-client" --access public --no-git-checks --tag="$TAG"
          pnpm publish --filter "./packages/*" --filter "!@nmtjs/proxy" --filter "!@nmtjs/prom-client" --access public --no-git-checks --tag="$TAG"

      - name: Publish Github Release
        if: ${{ inputs.release }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ env.VERSION_TAG }}',
              sha: context.sha
            }).then(() => github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ env.VERSION_TAG }}',
              name: '${{ env.VERSION_TAG }}',
              draft: false,
              prerelease: ${{ inputs.pre_release }},
              generate_release_notes: true
            }))
