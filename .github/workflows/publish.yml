name: Publish Neem stack

permissions:
  contents: write
  actions: write
  attestations: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Whether to run tests before publishing'
        type: boolean
        required: true
        default: false
      release:
        description: 'Whether to publish release'
        type: boolean
        required: true
        default: true
      pre_release:
        description: 'Whether it is a pre-release'
        type: boolean
        required: true
        default: false
      autotag:
        description: 'Whether to create a tag'
        type: boolean
        required: true
        default: true
      version:
        description: 'Version to publish'
        type: string
        required: true

jobs:
  test:
    if: ${{ inputs.run_tests }}
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-and-publish:
    needs: [test]
    if: ${{ always() && (!inputs.run_tests || needs.test.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: v${{ inputs.version }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version
        run: node scripts/prepare-release.js stack "$RELEASE_VERSION"

      - name: Build TypeScript packages
        run: pnpm run build:ts

      - name: Dry-run publish and publish
        run: |
          TAG=$(node scripts/tag.js "$RELEASE_VERSION")
          pnpm publish --dry-run --filter "./packages/*" --filter "!@nmtjs/proxy" --filter "!@nmtjs/prom-client" --access public --no-git-checks --tag="$TAG"
          pnpm publish --filter "./packages/*" --filter "!@nmtjs/proxy" --filter "!@nmtjs/prom-client" --access public --no-git-checks --tag="$TAG"

      - name: Publish Github Release
        if: ${{ inputs.release }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ env.VERSION_TAG }}',
              sha: context.sha
            }).then(() => github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ env.VERSION_TAG }}',
              name: '${{ env.VERSION_TAG }}',
              draft: false,
              prerelease: ${{ inputs.pre_release }},
              generate_release_notes: true
            }))
