services:
  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    ports:
      - '${VALKEY_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - '${TOXIPROXY_PORT:-8474}:8474'
      - '${REDIS_PROXY_PORT:-6382}:6382'
      - '${VALKEY_PROXY_PORT:-6383}:6383'
    depends_on:
      redis:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: neemata
      POSTGRES_PASSWORD: neemata
      POSTGRES_DB: neemata
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'neemata']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
