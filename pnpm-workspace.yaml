packages:
  - packages/*

allowBuilds:
  esbuild: true

catalog:
  rolldown: ^1.2.12
  zod: ^4.4.3

# 3 days, in minutes.
minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  # The stack installs proxy from npm, so a fresh release must be usable at once.
  - '@nmtjs/proxy'
  - '@nmtjs/proxy-*'
  # The workspace is pinned to Effect 4.0.4, published 2026-10-13, which the
  # native workflow engine targets. Only that version is admitted early: any
  # later Effect release still waits out the policy. These entries are
  # redundant from 2026-10-17 and can be removed.
  - effect@4.0.4
  - '@effect/platform-node@4.0.4'
  - '@effect/platform-node-shared@4.0.4'
  - '@effect/sql-pg@4.0.4'
